<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-khs-bridge="missing">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- CSP：不加载任何外部资源；脚本/样式仅限本地文件；图片允许 data: 以支持内核产物缩略图。
     tools/devserver.js 会把 connect-src 放开并注入浏览器宿主桥，因此这里的 'none' 必须保留。 -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'" />
<title>KernelHub Studio</title>
<link rel="stylesheet" href="styles/tokens.css" />
<link rel="stylesheet" href="styles/base.css" />
<link rel="stylesheet" href="styles/layout.css" />
<link rel="stylesheet" href="styles/components.css" />
<link rel="stylesheet" href="styles/views.css" />
</head>
<body>

<!-- 能力探测：window.khs 由 preload 通过 contextBridge 注入（浏览器开发宿主由
     devhost/khs-browser.js 注入）。探测逻辑在 js/boot.js 里，不用内联脚本，
     以符合 script-src 'self' 的 CSP；默认值 data-khs-bridge="missing" 声明在 <html> 上，
     桥接可用时由 boot.js 改为 "ready"。devserver 会在下面这行脚本之前注入浏览器桥。 -->
<script type="module" src="js/boot.js"></script>

<!-- 无 preload 桥时的兜底提示页（默认隐藏，app.js 探测到没有桥时显式显示） -->
<div id="bridge-fallback" class="bridge-fallback" hidden>
  <div class="bridge-fallback__card">
    <div class="bridge-fallback__mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.5"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3 3 7.5v9L12 21l9-4.5v-9L12 3Z" />
        <path d="M12 3v18M3 7.5 12 12l9-4.5" />
      </svg>
    </div>
    <h1>请在 Electron 中运行 KernelHub Studio</h1>
    <p>
      当前页面没有检测到主进程桥接对象 <code>window.khs</code>，因此内核仓库、格式矩阵与转换队列都不可用。
      本项目不加载任何第三方脚本或网络资源，请通过 Electron 宿主启动：
    </p>
    <pre><code>npm start        # 或 npm run dev（开启开发者工具）</code></pre>
    <p class="bridge-fallback__hint">界面本身已完整加载，只是缺少与主进程通信的通道。</p>
  </div>
</div>

<!-- 应用外壳：由 app.js 在桥接可用时接管 -->
<div id="app" class="app" hidden>

  <!-- 顶栏：左侧产品名，右侧主题切换 + 窗口控制（无边框窗口的拖拽区） -->
  <header id="titlebar" class="topbar">
    <div class="topbar__brand">
      <span>KernelHub Studio</span>
      <span id="titlebar-version" class="topbar__version"></span>
    </div>

    <div class="topbar__actions">
      <button id="theme-toggle" class="btn btn--icon" type="button" data-theme-toggle="dark"
              title="切换深浅主题" aria-label="切换深浅主题"></button>
      <div class="wincontrols" role="group" aria-label="窗口控制">
        <button id="win-min" class="btn btn--icon" type="button" title="最小化">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5"
               stroke-linecap="round" aria-hidden="true"><path d="M5 12h14" /></svg>
          <span class="visually-hidden">最小化窗口</span>
        </button>
        <button id="win-max" class="btn btn--icon" type="button" title="最大化">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5"
               aria-hidden="true"><rect x="5" y="5" width="14" height="14" /></svg>
          <span class="visually-hidden">最大化窗口</span>
        </button>
        <button id="win-close" class="btn btn--icon" type="button" title="关闭">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5"
               stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
          <span class="visually-hidden">关闭窗口</span>
        </button>
      </div>
    </div>
  </header>

  <div class="shell">
    <!-- 侧栏：6 个视图 + 设置 + 命令面板入口（编号列用等宽字） -->
    <aside id="sidebar" class="sidebar" aria-label="主导航">
      <nav id="nav" class="nav" aria-label="视图导航"></nav>
      <div id="sidebar-kernelbar" class="sidebar__status" aria-live="polite"></div>
    </aside>

    <!-- 主区：视图挂载点 -->
    <main id="view" class="view" role="main" tabindex="-1"></main>
  </div>

  <!-- 底部状态栏 -->
  <footer id="statusbar" class="statusbar"></footer>
</div>

<!-- 全局浮层容器（toast / modal / 命令面板） -->
<div id="toast-host" class="toast-host" role="region" aria-live="polite" aria-label="通知"></div>
<div id="modal-host" class="modal-host" aria-live="polite"></div>
<div id="cmdk-host" class="cmdk-host" role="dialog" aria-modal="true" aria-label="命令面板"></div>

<noscript>
  <p style="padding:24px;font:14px sans-serif">KernelHub Studio 需要启用 JavaScript。</p>
</noscript>

<script type="module" src="js/app.js"></script>
</body>
</html>
